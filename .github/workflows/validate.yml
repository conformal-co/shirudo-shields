# Pull request checks, safe for forks: `pull_request` only (read-only token,
# no secrets), GitHub-hosted runners, actions pinned to commits, downloads to
# sha256. Nothing is signed or published.
name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BPFTOOL_URL: https://github.com/libbpf/bpftool/releases/download/v7.8.1/bpftool-v7.8.1-amd64.tar.gz
  BPFTOOL_SHA256: 112026bbdf48d0d00ccfc4926e59878d47943f97c197f959f110abe29c898ddc

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt
      - run: tools/validate

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: build inputs from tools/build.lock
        id: lock
        run: |
          python3 - >>"$GITHUB_OUTPUT" <<'EOF'
          import tomllib
          lock = tomllib.load(open("tools/build.lock", "rb"))
          print(f"shirudo_commit={lock['shirudo_commit']}")
          EOF
      - name: upstream Shirudo vendor/libbpf (public)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: shirudo-dev/shirudo
          ref: ${{ steps.lock.outputs.shirudo_commit }}
          path: shirudo-src
          sparse-checkout: vendor/libbpf
          persist-credentials: false
      - name: vmlinux.h from the runner kernel's BTF
        run: |
          curl -fsSL "$BPFTOOL_URL" -o "$RUNNER_TEMP/bpftool.tgz"
          echo "$BPFTOOL_SHA256  $RUNNER_TEMP/bpftool.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/bpftool.tgz" -C "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/bpftool"
          "$RUNNER_TEMP/bpftool" btf dump file /sys/kernel/btf/vmlinux format c >"$RUNNER_TEMP/vmlinux.h"
          echo "runner kernel $(uname -r), vmlinux.h sha256 $(sha256sum "$RUNNER_TEMP/vmlinux.h" | cut -c1-64)"
      - name: compiler image (tools/ci/Dockerfile)
        run: docker build -q -t shield-ci-clang tools/ci
      - name: tools/build --unpinned
        run: |
          tools/build --unpinned --image shield-ci-clang \
            --libbpf shirudo-src/vendor/libbpf --vmlinux "$RUNNER_TEMP/vmlinux.h" \
            --out "$RUNNER_TEMP/build"

  dco:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Signed-off-by on every human commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          fail=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            email=$(git log -1 --format=%ae "$c")
            case "$email" in
              *"[bot]@users.noreply.github.com") continue ;;  # automation: no DCO
            esac
            want="Signed-off-by: $(git log -1 --format='%an <%ae>' "$c")"
            if ! git log -1 --format=%B "$c" | grep -qiF "$want"; then
              echo "::error::commit $c has no '$want'. Add it with 'git commit --amend -s' (or 'git rebase --signoff $BASE') and force-push."
              fail=1
            fi
          done
          exit $fail
