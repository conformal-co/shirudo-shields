# Publishes main to the registry; configuration is in repository and environment secrets.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "print the add/remove diff against the live index, push nothing"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-shield-registry
  cancel-in-progress: false

env:
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt
      - run: tools/validate

  gate:
    needs: validate
    if: github.repository == 'conformal-co/shirudo-shields' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - id: check
        env:
          CONFIGURED: ${{ secrets.GCP_WIF_PROVIDER != '' }}
        run: |
          count=$(python3 -c 'import sys; sys.path.insert(0, "tools"); import shieldlib as sl; print(sum(1 for _, s in sl.load_shields() if sl.published_version(s)))')
          if [ "$CONFIGURED" != true ]; then
            echo "::notice::publishing is not configured here: skipped"
            echo publish=false >>"$GITHUB_OUTPUT"
          elif [ "$count" = 0 ]; then
            echo "::notice::no shield to publish: skipped"
            echo publish=false >>"$GITHUB_OUTPUT"
          else
            echo publish=true >>"$GITHUB_OUTPUT"
          fi

  publish:
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: configuration
        env:
          REGISTRY: ${{ secrets.SHIELD_REGISTRY }}
          NAMESPACE: ${{ secrets.SHIELD_NAMESPACE }}
          TREE_ENDPOINT: ${{ secrets.SHIELD_TREE_ENDPOINT }}
          WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
          PUBLISH_SA: ${{ secrets.GCP_PUBLISH_SA }}
          BUILD_IMAGE: ${{ secrets.SHIRUDO_BUILD_IMAGE }}
          TOOLS_URL: ${{ secrets.SHIRUDO_OPERATOR_TOOLS_URL }}
          TOOLS_SHA256: ${{ secrets.SHIRUDO_OPERATOR_TOOLS_SHA256 }}
          KMS_KEY_VERSION: ${{ secrets.SHIRUDO_KMS_KEY_VERSION }}
          CERT_SHA256: ${{ vars.SHIRUDO_RELEASE_CERT_SHA256 }}
        run: |
          for v in REGISTRY NAMESPACE TREE_ENDPOINT WIF_PROVIDER PUBLISH_SA BUILD_IMAGE TOOLS_URL TOOLS_SHA256 KMS_KEY_VERSION CERT_SHA256; do
            test -n "${!v}" || { echo "::error::release configuration incomplete: $v is not set"; exit 1; }
          done
          img=${BUILD_IMAGE#*/}
          for part in "${NAMESPACE%%/*}" "$img" "${img%@*}" "${TREE_ENDPOINT#oci://*/}"; do
            echo "::add-mask::$part"
          done

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt

      - id: gcp
        uses: google-github-actions/auth@ba79af03959ebeac9769e648f473a284504d9193 # v2.1.10
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_PUBLISH_SA }}
          token_format: access_token
          access_token_lifetime: 1800s
          create_credentials_file: false

      - name: diff against the live index
        env:
          REGISTRY: ${{ secrets.SHIELD_REGISTRY }}
          NAMESPACE: ${{ secrets.SHIELD_NAMESPACE }}
          SHIELD_TREE_ENDPOINT: ${{ secrets.SHIELD_TREE_ENDPOINT }}
          PUBLISH_REGISTRY_USERNAME: oauth2accesstoken
          PUBLISH_REGISTRY_PASSWORD: ${{ steps.gcp.outputs.access_token }}
        run: tools/publish --registry "$REGISTRY" --namespace "$NAMESPACE" --dry-run

      - name: operator tools and build image
        if: env.DRY_RUN != '1'
        env:
          REGISTRY: ${{ secrets.SHIELD_REGISTRY }}
          TOOLS_URL: ${{ secrets.SHIRUDO_OPERATOR_TOOLS_URL }}
          TOOLS_SHA256: ${{ secrets.SHIRUDO_OPERATOR_TOOLS_SHA256 }}
          SHIRUDO_BUILD_IMAGE: ${{ secrets.SHIRUDO_BUILD_IMAGE }}
          ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
        run: |
          case "$TOOLS_URL" in
          https://*.googleapis.com/*)
            printf 'Authorization: Bearer %s\n' "$ACCESS_TOKEN" |
              curl -fsSL -H @- "$TOOLS_URL" -o "$RUNNER_TEMP/tools.tar.gz" ;;
          *)
            curl -fsSL "$TOOLS_URL" -o "$RUNNER_TEMP/tools.tar.gz" ;;
          esac
          echo "$TOOLS_SHA256  $RUNNER_TEMP/tools.tar.gz" | sha256sum -c --quiet -
          mkdir -p "$RUNNER_TEMP/shirudo-src"
          tar -xzf "$RUNNER_TEMP/tools.tar.gz" -C "$RUNNER_TEMP/shirudo-src"
          test -x "$RUNNER_TEMP/shirudo-src/tools/signers/gcp-kms-mldsa" ||
            { echo "::error::the operator tools have no tools/signers/gcp-kms-mldsa"; exit 1; }
          DOCKER_CONFIG=$(mktemp -d)
          export DOCKER_CONFIG
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          if [ "${SHIRUDO_BUILD_IMAGE%%/*}" = "$REGISTRY" ]; then
            printf '%s' "$ACCESS_TOKEN" |
              docker login -u oauth2accesstoken --password-stdin "$REGISTRY" >/dev/null
          fi
          docker pull -q "$SHIRUDO_BUILD_IMAGE" >/dev/null

      - name: tools/publish
        if: env.DRY_RUN != '1'
        env:
          REGISTRY: ${{ secrets.SHIELD_REGISTRY }}
          NAMESPACE: ${{ secrets.SHIELD_NAMESPACE }}
          SHIELD_TREE_ENDPOINT: ${{ secrets.SHIELD_TREE_ENDPOINT }}
          PUBLISH_REGISTRY_USERNAME: oauth2accesstoken
          PUBLISH_REGISTRY_PASSWORD: ${{ steps.gcp.outputs.access_token }}
          SHIRUDO_BUILD_IMAGE: ${{ secrets.SHIRUDO_BUILD_IMAGE }}
          CERT_SHA256: ${{ vars.SHIRUDO_RELEASE_CERT_SHA256 }}
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
          SHIRUDO_KMS_KEY_VERSION: ${{ secrets.SHIRUDO_KMS_KEY_VERSION }}
          SHIRUDO_KMS_PROTECTION_LEVEL: ${{ vars.SHIRUDO_KMS_PROTECTION_LEVEL }}
        run: |
          tools/publish --registry "$REGISTRY" --namespace "$NAMESPACE" \
            --cert keys/conformal.der --expect-cert-sha256 "$CERT_SHA256" \
            --signer "$RUNNER_TEMP/shirudo-src/tools/signers/gcp-kms-mldsa" \
            --shirudo-src "$RUNNER_TEMP/shirudo-src"
